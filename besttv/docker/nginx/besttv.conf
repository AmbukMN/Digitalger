# ── BestTV (besttv.us) ───────────────────────────────────────────────────────
# ⚠️ Энэ файл DigitalGer-ийн nginx (docker-nginx-1) дотор ажиллана:
#     /opt/DigitalGer/docker/nginx/conf.d/besttv.conf
# BestTV container-ууд `docker_internal` сүлжээнд нэгдсэн тул нэрээр нь хандана.

# ⚠️ Docker-ийн дотоод DNS (127.0.0.11).
#
# Үнэгүй nginx нь `upstream` доторх нэрийг АСАХ ҮЕДЭЭ НЭГ Л УДАА IP болгож
# кэшлэдэг — container rebuild хийхэд IP солигдож 502 өгнө (гараар reload
# хийх хүртэл). `upstream ... resolve` нь зөвхөн nginx PLUS-д ажилладаг.
#
# ШИЙДЭЛ: upstream блок ХЭРЭГЛЭХГҮЙ, оронд нь `proxy_pass`-д хувьсагч
# ($besttv_frontend г.м.) ашиглана — хувьсагчтай үед nginx нь DNS-ыг
# ГҮЙЛГЭЭ БҮРД resolver-ээр дахин шийддэг тул IP солигдоход өөрөө дагана.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── СПАМ / БОТ ХАМГААЛАЛТ ───────────────────────────────────────────────────
# ⚠️ Backend хүртэл хүрэхээс ӨМНӨ nginx түвшинд барина — DB/CPU хамгаална.
#
# Түлхүүр = Cloudflare-ийн ЖИНХЭНЭ клиент IP. `$binary_remote_addr` шууд
# ашиглавал бүх хэрэглэгч Cloudflare-ийн edge IP-тэй мэт тоологдож,
# нэг бот БҮХ хүнийг блоклоно.
map $http_cf_connecting_ip $besttv_client_ip {
    ""      $binary_remote_addr;  # Cloudflare-гүй (шууд хандалт)
    default $http_cf_connecting_ip;
}

# Бүсүүд (нийт санах ой 10MB ≈ 160,000 IP)
#   api   — ерөнхий API (секундэд 20, түр огцом урсгалд burst 40)
#   auth  — нэвтрэх/бүртгүүлэх (brute-force хамгаалалт)
#   write — POST/PUT (спам бичилт)
limit_req_zone $besttv_client_ip zone=besttv_api:10m rate=20r/s;
limit_req_zone $besttv_client_ip zone=besttv_auth:10m rate=1r/s;
limit_req_zone $besttv_client_ip zone=besttv_write:10m rate=5r/s;

# Нэг IP-ээс зэрэг нээх холболтын тоо (slowloris хамгаалалт)
limit_conn_zone $besttv_client_ip zone=besttv_conn:10m;

# 429 — стандарт хариу (503 биш, бот дахин оролдох давтамжаа бууруулна)
limit_req_status 429;
limit_conn_status 429;

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name besttv.us www.besttv.us admin.besttv.us api.besttv.us;
    return 301 https://$host$request_uri;
}

# ── besttv.us — Frontend ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name besttv.us www.besttv.us;

    # Хувьсагч — DNS-ыг гүйлгээ бүрд дахин шийдүүлнэ (rebuild-д 502 өгөхгүй)
    set $up_frontend besttv-frontend:3100;
    set $up_admin    besttv-admin:3101;
    set $up_backend  besttv-backend:4100;

    ssl_certificate /etc/ssl/cloudflare/besttv.pem;
    ssl_certificate_key /etc/ssl/cloudflare/besttv.key;
    include /etc/nginx/conf.d/ssl.conf;

    # Видео stream-д том буфер/урт timeout хэрэгтэй
    client_max_body_size 20m;

    # ⚠️ Аюулгүй байдлын толгойнууд — Google Safe Browsing болон бусад
    # сканнерын үнэлгээнд ЧУХАЛ. Шинэ домэйн дээр эдгээр байхгүй бол
    # "сэжигтэй" гэж тэмдэглэгдэх магадлал өснө.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location / {
        proxy_pass http://$up_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js static — hash нэртэй тул мөнхийн cache
    location /_next/static/ {
        proxy_pass http://$up_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://$up_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ⚠️ HLS stream — /api/stream/* нь m3u8 + segment буцаана.
    # Урт timeout, буферчлэлгүй (сегмент шууд дамжина).
    location /api/stream/ {
        proxy_pass http://$up_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Бусад /api/* — Next rewrite-аар backend руу очих ч, шууд дамжуулах нь хурдан.
    # ⚠️ /api/auth/* нь NextAuth-д хэрэгтэй тул frontend-д ҮЛДЭЭНЭ.
    location /api/ {
        proxy_pass http://$up_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── admin.besttv.us — Admin panel ────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name admin.besttv.us;

    # Хувьсагч — DNS-ыг гүйлгээ бүрд дахин шийдүүлнэ (rebuild-д 502 өгөхгүй)
    set $up_frontend besttv-frontend:3100;
    set $up_admin    besttv-admin:3101;
    set $up_backend  besttv-backend:4100;

    ssl_certificate /etc/ssl/cloudflare/besttv.pem;
    ssl_certificate_key /etc/ssl/cloudflare/besttv.key;
    include /etc/nginx/conf.d/ssl.conf;

    # Админ видео/зураг upload — том файл
    client_max_body_size 5g;

    # Хайлтын систем индекслэхгүй
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://$up_admin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    location /_next/static/ {
        proxy_pass http://$up_admin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ⚠️ Видео upload — 5GB хүртэл, урт timeout, буферчлэлгүй
    location /api/ {
        proxy_pass http://$up_admin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 5g;
    }
}

# ── api.besttv.us — Backend API (шууд хандалт) ───────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.besttv.us;

    # Хувьсагч — DNS-ыг гүйлгээ бүрд дахин шийдүүлнэ (rebuild-д 502 өгөхгүй)
    set $up_frontend besttv-frontend:3100;
    set $up_admin    besttv-admin:3101;
    set $up_backend  besttv-backend:4100;

    ssl_certificate /etc/ssl/cloudflare/besttv.pem;
    ssl_certificate_key /etc/ssl/cloudflare/besttv.key;
    include /etc/nginx/conf.d/ssl.conf;

    client_max_body_size 5g;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # HLS stream — буферчлэлгүй, урт timeout
    location /api/stream/ {
        proxy_pass http://$up_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ⚠️ Нэвтрэлт — brute-force хамгаалалт (секундэд 1, burst 5)
    location ~ ^/api/auth/(login|register|admin/login|oauth) {
        limit_req zone=besttv_auth burst=5 nodelay;
        limit_conn besttv_conn 10;

        proxy_pass http://$up_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ⚠️ Нээлттэй бичилтийн endpoint — спам хамгаалалт
    location ~ ^/api/(email/subscribe|email/unsubscribe|track|reviews) {
        limit_req zone=besttv_write burst=10 nodelay;
        limit_conn besttv_conn 15;

        proxy_pass http://$up_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ⚠️ Upload — limit ХЭРЭГЛЭХГҮЙ (том файл удаан урсана, тасрах ёсгүй)
    location /api/admin/uploads/ {
        proxy_pass http://$up_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        # Ерөнхий API — секундэд 20, огцом урсгалд burst 40
        limit_req zone=besttv_api burst=40 nodelay;
        limit_conn besttv_conn 30;

        proxy_pass http://$up_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
