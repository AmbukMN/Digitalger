# BestTV — Production (VPS 62.238.47.2, besttv.us)
#
# ⚠️ ЗААВАЛ project name-тэй ажиллуулна:
#     docker compose -f docker/docker-compose.prod.yml -p besttv up -d
#
# Учир нь DigitalGer ч мөн `docker/` хавтастай — project name автоматаар
# "docker" болж НӨГӨӨ СТЕКИЙН container-ыг устгадаг.
#
# ⚠️ Nginx нь DigitalGer-ийн стект байгаа (docker-nginx-1) — энд ДАХИН
# үүсгэхгүй. BestTV-ийн nginx conf-ыг DigitalGer-ийн conf.d руу нэмнэ.
# Тиймээс энэ стек нь `digitalger_internal` сүлжээнд гаднаас нэгдэнэ.

services:
  postgres:
    image: postgres:16-alpine
    container_name: besttv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-besttv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-besttv}
    volumes:
      - besttv_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-besttv}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - besttv_net

  redis:
    image: redis:7-alpine
    container_name: besttv-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - besttv_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - besttv_net

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: besttv-backend
    restart: unless-stopped
    # ⚠️⚠️ ЦАГИЙН БҮС — cron-ууд UTC-д ажиллаж БУРУУ ЦАГТ хийгдэж
    #    байв: «03:00 цэвэрлэгээ» → бодитоор 11:00 (ачаалалтай цаг),
    #    «10:00 эрх дуусах имэйл» → бодитоор 18:00.
    #    ⚠️ `@Cron`-д `timeZone` заасан нь энэ хамаарахгүй (тэр давуу).
    environment:
      TZ: Asia/Ulaanbaatar
    # ⚠️⚠️ ЭНЭ ФАЙЛААС УНШИНА (`.env` БИШ). Шинэ хувьсагч нэмэхдээ
    #    ЗААВАЛ `.env.production`-д бич — `.env`-д бичвэл container-д
    #    ХҮРЭХГҮЙ (Telegram мэдэгдэл чимээгүй унтарсан бодит алдаа).
    env_file:
      - ../backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - besttv_net
      # ⚠️ n8n руу Telegram мэдэгдэл илгээхэд (дэлгэрэнгүй доор)
      - n8n_net
      - nginx_net

  # HLS хөрвүүлэлтийн worker — backend-тэй ижил image, өөр entrypoint.
  # ⚠️ Queue/processor код өөрчлөгдвөл ЭНЭ container-ыг ЗААВАЛ rebuild
  # (backend rebuild хангалтгүй — processor зөвхөн энд ажиллана).
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: besttv-worker
    restart: unless-stopped
    # ⚠️⚠️ ЦАГИЙН БҮС — cron-ууд UTC-д ажиллаж БУРУУ ЦАГТ хийгдэж
    #    байв: «03:00 цэвэрлэгээ» → бодитоор 11:00 (ачаалалтай цаг),
    #    «10:00 эрх дуусах имэйл» → бодитоор 18:00.
    #    ⚠️ `@Cron`-д `timeZone` заасан нь энэ хамаарахгүй (тэр давуу).
    environment:
      TZ: Asia/Ulaanbaatar
    # ⚠️⚠️ ЭНЭ ФАЙЛААС УНШИНА (`.env` БИШ). Шинэ хувьсагч нэмэхдээ
    #    ЗААВАЛ `.env.production`-д бич — `.env`-д бичвэл container-д
    #    ХҮРЭХГҮЙ (Telegram мэдэгдэл чимээгүй унтарсан бодит алдаа).
    env_file:
      - ../backend/.env.production
    command: ['node', 'dist/src/worker.js']
    # ⚠️ Worker нь ВЕБ СЕРВЕР БИШ (HLS queue consumer) — image-ийн HTTP
    # healthcheck нь үргэлж унана. Процесс амьд эсэхийг л шалгана.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "dist/src/worker.js" > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - besttv_net
      # ⚠️ n8n руу Telegram мэдэгдэл илгээхэд (дэлгэрэнгүй доор)
      - n8n_net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_ASSETS_URL: ${NEXT_PUBLIC_ASSETS_URL}
        NEXT_PUBLIC_CHAT_WEBHOOK_URL: ${NEXT_PUBLIC_CHAT_WEBHOOK_URL}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        API_URL: http://backend:4100
    container_name: besttv-frontend
    restart: unless-stopped
    env_file:
      - ../frontend/.env.production
    depends_on:
      - backend
    networks:
      - besttv_net
      - nginx_net

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_ASSETS_URL: ${NEXT_PUBLIC_ASSETS_URL}
        API_URL: http://backend:4100
    container_name: besttv-admin
    restart: unless-stopped
    env_file:
      - ../admin/.env.production
    depends_on:
      - backend
    networks:
      - besttv_net
      - nginx_net

volumes:
  besttv_pg_data:
  besttv_redis_data:

networks:
  # Дотоод — DB/Redis зөвхөн энд харагдана
  besttv_net:
    driver: bridge
  # ⚠️ DigitalGer-ийн nginx (docker-nginx-1) ЭНЭ сүлжээнд байгаа. BestTV-ийн
  # web container-ууд мөн энд нэгдсэнээр nginx нь `besttv-frontend:3100` гэх
  # мэт контейнерийн нэрээр шууд proxy_pass хийж чадна.
  nginx_net:
    external: true
    name: docker_internal
  # ⚠️ DigitalGer-ийн n8n (digitalger-n8n) ЭНЭ сүлжээнд ажиллана.
  # Telegram мэдэгдэл нь backend → n8n webhook → Telegram гэж явдаг тул
  # backend нь `http://digitalger-n8n:5678` гэж КОНТЕЙНЕРИЙН НЭРЭЭР
  # хандах шаардлагатай.
  #
  # ⚠️ Гадаад IP (62.238.47.2:5678) руу залгах нь БОЛОХГҮЙ: тэр порт
  # интернэтэд нээлттэй тул хэн ч webhook дуудаж хуурамч мэдэгдэл
  # илгээх боломжтой болно. Дотоод сүлжээгээр л явна.
  n8n_net:
    external: true
    name: digitalger-n8n-network
