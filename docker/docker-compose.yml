# DigitalGer — production-style local stack
services:
  postgres:
    image: postgres:16-alpine
    container_name: digitalger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: digitalger
      POSTGRES_PASSWORD: digitalger_secret
      POSTGRES_DB: digitalger
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digitalger -d digitalger']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: digitalger-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: digitalger-api
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://digitalger:digitalger_secret@postgres:5432/digitalger?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      FRONTEND_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  zip-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://digitalger:digitalger_secret@postgres:5432/digitalger?schema=public
      REDIS_URL: redis://redis:6379
      ZIP_WORKER_CONCURRENCY: 5
    command: ["node", "dist/src/worker.js"]
    deploy:
      replicas: 2          # docker compose up --scale zip-worker=N гэж өөрчлөх боломжтой
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: digitalger-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - backend

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: digitalger-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXTAUTH_URL: http://localhost:3001
    ports:
      - '3001:3001'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
