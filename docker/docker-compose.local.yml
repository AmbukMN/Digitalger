# DigitalGer — FULL LOCAL DOCKER VALIDATION
# Usage: docker compose -f docker/docker-compose.local.yml up --build
# Requires: .env.docker in project root

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env.docker
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - local_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalger -d digitalger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_local_data:/data
    networks:
      - local_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.docker
    networks:
      - local_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    env_file:
      - ../.env.docker
    environment:
      NEXTAUTH_URL: http://localhost:3000
    networks:
      - local_net
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    restart: unless-stopped
    env_file:
      - ../.env.docker
    environment:
      NEXTAUTH_URL: http://localhost:3001
    networks:
      - local_net
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "3001:3001"
      - "4000:4000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - local_net
    depends_on:
      - frontend
      - admin
      - backend

networks:
  local_net:
    driver: bridge

volumes:
  postgres_local_data:
  redis_local_data:
