# DigitalGer — FULL LOCAL DOCKER VALIDATION
# Usage: docker compose -f docker/docker-compose.local.yml up --build
# Requires: .env.docker in project root

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env.docker
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - local_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalger -d digitalger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_local_data:/data
    networks:
      - local_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ../.env.docker
    networks:
      - local_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SITE_URL: http://localhost:3100
    restart: unless-stopped
    ports:
      - "3100:3000"
    env_file:
      - ../.env.docker
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_URL_INTERNAL: http://localhost:3000
      INTERNAL_API_URL: http://backend:4000
    networks:
      - local_net
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "3101:3001"
    env_file:
      - ../.env.docker
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: http://localhost:3101
      NEXTAUTH_URL_INTERNAL: http://localhost:3001
      INTERNAL_API_URL: http://backend:4000
    networks:
      - local_net
    depends_on:
      backend:
        condition: service_healthy

  zip-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.docker
    command: ["node", "dist/src/worker.js"]
    networks:
      - local_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # nginx temporarily disabled for local validation (nginx:1.27-alpine pull fails due to network)
  # nginx:
  #   image: nginx:1.27-alpine
  #   ports: ["80:80", "3001:3001", "4000:4000"]

networks:
  local_net:
    driver: bridge

volumes:
  postgres_local_data:
  redis_local_data:
