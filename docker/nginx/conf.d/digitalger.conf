# ── Upstream definitions ──────────────────────────────────────────────────────
upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream admin_upstream {
    server admin:3001;
    keepalive 16;
}

upstream backend_upstream {
    server backend:4000;
    keepalive 32;
}

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name digitalger.mn www.digitalger.mn admin.digitalger.mn api.digitalger.mn bot.digitalger.mn;
    return 301 https://$host$request_uri;
}

# ── digitalger.mn (Frontend) ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name digitalger.mn www.digitalger.mn;

    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    include /etc/nginx/conf.d/ssl.conf;

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js static files — long cache (hash нэртэй тул immutable)
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Статик brand/lого/icon/manifest — урт cache (хувирамтгай бус)
    location ~* ^/(brand|images|icons)/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000"; # 30 хоног
    }

    # Next.js оптимизацилсан зураг — урт cache
    location /_next/image {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }
}

# ── admin.digitalger.mn (Admin Panel) ────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name admin.digitalger.mn;

    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    include /etc/nginx/conf.d/ssl.conf;

    # Restrict to known IPs in production if needed
    # allow 1.2.3.4;
    # deny all;

    location / {
        proxy_pass http://admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ── api.digitalger.mn (Backend API) ──────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.digitalger.mn;

    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    include /etc/nginx/conf.d/ssl.conf;

    client_max_body_size 100M;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ── bot.digitalger.mn (n8n Automation) ───────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name bot.digitalger.mn;

    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    include /etc/nginx/conf.d/ssl.conf;

    client_max_body_size 16M;

    location / {
        proxy_pass http://172.17.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
