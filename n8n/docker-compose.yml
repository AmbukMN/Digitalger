# DigitalGer — n8n Automation Layer
# Isolated service — does NOT share network or volumes with main DigitalGer stack
#
# Local:      cd n8n && docker compose up -d
# Production: cd n8n && docker compose up -d   (.env controls behavior)

services:

  # ── n8n PostgreSQL (ISOLATED — n8n only, NOT DigitalGer business DB) ────────
  n8n-postgres:
    image: postgres:16-alpine
    container_name: digitalger-n8n-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n-internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── n8n ──────────────────────────────────────────────────────────────────────
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: n8n-python:2.21.7
    container_name: digitalger-n8n
    restart: always
    depends_on:
      n8n-postgres:
        condition: service_healthy
    # ⚠️⚠️ ЗӨВХӨН ЛОКАЛ — интернэтэд ил гаргахгүй.
    #
    # Өмнө нь '5678:5678' байсан тул n8n-ий удирдлагын хуудас
    # http://62.238.47.2:5678 хаягаар ИНТЕРНЭТЭЭС нээгддэг байв
    # (Docker нь UFW firewall-ыг тойрдог). Чатбот, төлбөрийн
    # мэдэгдэл, нийтлэлийн БҮХ workflow тэнд байна.
    #
    # ⚠️ nginx нь docker_internal сүлжээгээр 'digitalger-n8n:5678'
    #    гэж хандах тул порт нээх ОГТ шаардлагагүй.
    ports:
      - '127.0.0.1:5678:5678'
    environment: &n8n_env
      # ── Host & protocol ──────────────────────────────────────────────────────
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678}

      # ── Timezone ─────────────────────────────────────────────────────────────
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Ulaanbaatar}
      - TZ=${TZ:-Asia/Ulaanbaatar}

      # ── Auth ─────────────────────────────────────────────────────────────────
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-}

      # ── Task runner (Code node) ──────────────────────────────────────────────
      # ⚠️⚠️ Hardened Alpine image-д Python 3 байхгүй → internal runner Python-ийг
      # эхлүүлэх гэж оролдоод унадаг ("Task runner stopped"). MODE=internal + LOG
      # debug хослуулсан үед JS runner тогтвортой ажиллаж Code node гацахгүй
      # (comment reply бүрэн ажиллана). LOG=info үед runner тогтворгүй болж
      # execution waitingExecution-д гацдаг тул debug ЗААВАЛ. ⚠️ force-recreate
      # зайлсхий — restart л (force-recreate runner-ийг түр эвддэг).
      # ⚠️ Python 3 байхгүй тул internal runner crash loop (execution running-д гацна)
      # → runner БҮРЭН унтраав. Code node үндсэн процесст ажиллана (найдвартай).
      # ⚠️⚠️ Python 3 crash loop-оос болж internal runner execution-ыг running-д
      # гацаадаг байсан ([[feedback_n8n_task_runner_crash]]). Runner-ыг БҮРЭН
      # унтраав → Code node үндсэн процесст ажиллана (найдвартай, гацахгүй).
      - N8N_RUNNERS_ENABLED=false

      # ── QUEUE MODE (scale: 1000+ зэрэг чат) ────────────────────────────────
      # ⚠️⚠️ main webhook хүлээн авч Redis queue-д тавина, n8n-worker
      # боловсруулна. worker ЭНЭ anchor-аар ижил env авна (encryption key,
      # DB, FB token ЗААВАЛ ижил).
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      # ⚠️ Default нь 5 — 50 хэрэглэгч зэрэг бичихэд Code node гацдаг
      # (production тест: 50-аас 20 нь Build Messages дээр running-д үлдсэн)
      - N8N_RUNNERS_MAX_CONCURRENCY=10
      # ⚠️ Зэрэг ажиллах EXECUTION-ы хязгаар (runner-ийнхээс ӨӨР).
      # Default нь 30 — 50 хэрэглэгч зэрэг бичихэд 20 нь дараалалд
      # орж, n8n тэднийг эхлүүлэхгүй гацаадаг (production тест).
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=200

      # ── Encryption key ───────────────────────────────────────────────────────
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # ── Database — dedicated n8n PostgreSQL ──────────────────────────────────
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=public

      # ── Execution history ────────────────────────────────────────────────────
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336

      # ── Facebook/Instagram chatbot (workflow {{ $env[...] }} ашиглана) ─────────
      # ⚠️ ЗААВАЛ: энэ мөргүй бол FB Send API token хүрэхгүй → чат хариу өгөхгүй.
      # N8N_BLOCK_ENV_ACCESS_IN_NODE=false → workflow node-д $env уншихыг зөвшөөрнө
      # (n8n 2.21 default=true → 'access to env vars denied' алдаа).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - FB_PAGE_ACCESS_TOKEN=${FB_PAGE_ACCESS_TOKEN}
      - FB_VERIFY_TOKEN=${FB_VERIFY_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # ── Email via AWS SES SMTP ───────────────────────────────────────────────
      - N8N_EMAIL_MODE=${N8N_EMAIL_MODE:-smtp}
      - N8N_SMTP_HOST=${N8N_SMTP_HOST:-email-smtp.eu-north-1.amazonaws.com}
      - N8N_SMTP_PORT=${N8N_SMTP_PORT:-587}
      - N8N_SMTP_USER=${N8N_SMTP_USER:-}
      - N8N_SMTP_PASS=${N8N_SMTP_PASS:-}
      - N8N_SMTP_SENDER=${N8N_SMTP_SENDER:-noreply@digitalger.mn}
      - N8N_SMTP_SSL=false
      - N8N_SMTP_STARTTLS=true

      # ── Telegram ─────────────────────────────────────────────────────────────
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}

      # ── Logging ──────────────────────────────────────────────────────────────
      # ⚠️ debug ЗААВАЛ (info үед task runner тогтворгүй → Code node гацна, comment reply ажиллахгүй)
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-debug}
      - N8N_LOG_OUTPUT=console

      # ── Limits ───────────────────────────────────────────────────────────────
      - N8N_PAYLOAD_SIZE_MAX=${N8N_PAYLOAD_SIZE_MAX:-64}

      # ── Custom nodes ─────────────────────────────────────────────────────────
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom

      # ── Allow workflows to read env vars ─────────────────────────────────────
      - N8N_ALLOW_EXEC=true
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - N8N_RUNNERS_ALLOWED_MODULES=*

      # ── Disable telemetry ────────────────────────────────────────────────────
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_METRICS=${N8N_METRICS:-false}

    volumes:
      - ./data:/home/node/.n8n
      - ./custom-nodes:/home/node/.n8n/custom
      - ./backups:/home/node/backups

    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5678/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

    networks:
      - n8n-internal
      # ⚠️ DigitalGer-ийн backend (docker-backend-1) нь docker_internal
      #    сүлжээнд байдаг. Энэ мөргүйгээр n8n нь түүн рүү ЗӨВХӨН гадаад
      #    хаягаар (api.digitalger.mn) хүрдэг → Cloudflare rate limit.
      #    Хэмжилт: гадуур 45/60 амжилттай, дотуур 60/60.
      #    ⚠️ BestTV backend ЯГ ИЖИЛ зарчмаар 3 сүлжээнд холбогддог.
      - dg-app

  # ── Redis — n8n queue (BullMQ) — ТУСДАА (n8n-internal) ──────────────────────
  n8n-redis:
    image: redis:7-alpine
    container_name: digitalger-n8n-redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n-internal

  # ── n8n WORKER — queue-с ажил татаж боловсруулна (main-тай ижил env) ─────────
  n8n-worker:
    image: n8n-python:2.21.7
    container_name: digitalger-n8n-worker
    restart: always
    command: worker --concurrency=10
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    environment: *n8n_env
    volumes:
      - ./data:/home/node/.n8n
      - ./custom-nodes:/home/node/.n8n/custom
    networks:
      - n8n-internal
      - dg-app

volumes:
  n8n-postgres-data:
    name: digitalger-n8n-postgres-data

networks:
  n8n-internal:
    name: digitalger-n8n-network
    driver: bridge
  # ⚠️ ГАДНААС үүсгэсэн сүлжээ — DigitalGer-ийн үндсэн compose эзэмшинэ.
  #    external: true тул энэ compose нь ҮҮСГЭХГҮЙ, зөвхөн ХОЛБОГДОНО.
  dg-app:
    name: docker_internal
    external: true
