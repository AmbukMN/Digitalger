<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110" fill="none">
  <!-- Г.Амгаланбаяр гарын үсэг — cursive script (бодит гарын үсэг мэт нэг зураасаар) -->
  <g stroke="#0a1f5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Г үсгийн эхлэл — том эхлэлийн гогцоо -->
    <path d="M18 72 C 14 48, 30 30, 48 38 C 60 43, 54 62, 44 70 C 38 75, 30 74, 28 66 C 26 56, 36 50, 46 54" />
    <!-- холбоос → нэрийн биеийн долгионт зураас -->
    <path d="M46 54 C 62 48, 70 64, 82 60 C 92 56, 88 42, 98 40 C 110 38, 112 56, 104 66 C 98 73, 88 70, 90 60 C 92 50, 104 48, 116 54 C 128 60, 122 44, 134 42 C 148 40, 150 62, 140 70 C 132 76, 124 70, 128 60" />
    <!-- дунд хэсэг — урт гүйлгээ -->
    <path d="M128 60 C 144 54, 158 66, 174 58 C 188 51, 182 38, 194 38 C 208 38, 208 58, 198 66 C 190 72, 182 66, 186 56 C 190 47, 204 48, 218 56" />
    <!-- сүүл — урт дэгээ доош, баруун тийш гүйлгэх -->
    <path d="M218 56 C 234 50, 248 62, 264 54 C 278 47, 286 56, 296 50 C 286 64, 268 86, 240 92 C 220 96, 226 80, 244 78" />
    <!-- доогуур зураас (гарын үсгийн чимэг) -->
    <path d="M30 88 C 90 82, 200 84, 290 80" stroke-width="1.6" opacity="0.85" />
  </g>
</svg>
