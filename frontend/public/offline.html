<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Офлайн байна — DigitalGer</title>
    <style>
      :root {
        --navy: #022179;
        --gold: #ffbe00;
        --bg: #f7f8fb;
        --text: #1a1f36;
        --muted: #5b6478;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid #e6e9f0;
        border-radius: 20px;
        padding: 40px 28px;
        box-shadow: 0 12px 40px rgba(2, 33, 121, 0.08);
      }
      .logo {
        width: 160px;
        max-width: 70%;
        height: auto;
        margin: 0 auto 24px;
        display: block;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(2, 33, 121, 0.06);
        color: var(--navy);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        font-weight: 700;
        color: var(--navy);
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        width: 100%;
        padding: 14px 20px;
        font-size: 15px;
        font-weight: 600;
        color: var(--navy);
        background: var(--gold);
        border-radius: 12px;
        transition: transform 0.12s ease, filter 0.12s ease;
      }
      button:hover { filter: brightness(0.97); }
      button:active { transform: scale(0.98); }
      .hint {
        margin: 18px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/brand/logo-color.png" alt="DigitalGer" onerror="this.style.display='none'" />
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>Интернэт холболтоо шалгана уу</h1>
      <p>
        Та одоогоор офлайн байна. Холболтоо сэргээгээд дахин оролдоно уу.
        Урьд нь үзсэн зарим хуудас офлайн ажиллаж болно.
      </p>
      <button type="button" onclick="location.reload()">Дахин оролдох</button>
      <p class="hint">DigitalGer — Дижитал бүтээгдэхүүний marketplace</p>
    </div>
  </body>
</html>
