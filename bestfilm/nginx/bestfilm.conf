# ═══════════════════════════════════════════════════════════════════════════
# BestFilm — nginx (bestfilm.net)
# ═══════════════════════════════════════════════════════════════════════════
#
# ⚠️⚠️ ЭНЭ ФАЙЛЫГ VPS-ийн `/opt/DigitalGer/docker/nginx/conf.d/` РУУ хуулна.
#    Nginx нь DigitalGer-ийн стект (`docker-nginx-1`) ажилладаг.
#
#    scp bestfilm/nginx/bestfilm.conf \
#        root@62.238.47.2:/opt/DigitalGer/docker/nginx/conf.d/
#    ssh root@62.238.47.2 'docker exec docker-nginx-1 nginx -t && \
#                          docker restart docker-nginx-1'
#
# ⚠️⚠️ BestTV-ийн `besttv.conf` ХӨНДӨГДӨХГҮЙ — тусдаа файл.
#
# ⚠️⚠️ ДАВХАРДАЛ — nginx нь ЭДГЭЭРИЙГ ЗӨВШӨӨРДӨГГҮЙ:
#
#    `resolver` — «directive is duplicate» гэж УНАНА
#    `map`      — «duplicate map» гэж УНАНА
#
#    Тиймээс:
#      · `resolver` нь `besttv.conf`-д л зарлагдана (энд БИШ)
#      · `map` нь ӨӨР нэртэй (`$bestfilm_client_ip`)
#
# ⚠️ nginx нь БҮХ conf-ыг уншиж дуусаад ажилладаг тул файлын
#    дараалал (bestfilm < besttv) САНААГ ЗОВООХГҮЙ — `besttv.conf`-ийн
#    `resolver` нь энэ файлын `proxy_pass`-д ч үйлчилнэ.

# ── DNS RESOLVER ────────────────────────────────────────────────────────────
# ⚠️⚠️ Docker-ийн дотоод DNS (127.0.0.11) — ЗААВАЛ.
#
# Үнэгүй nginx нь `upstream` доторх нэрийг АСАХ ҮЕДЭЭ НЭГ Л УДАА IP болгож
# кэшлэдэг — container rebuild хийхэд IP солигдож 502 өгнө (гараар reload
# хийх хүртэл). `upstream ... resolve` нь зөвхөн nginx PLUS-д ажилладаг.
#
# ШИЙДЭЛ: upstream блок ХЭРЭГЛЭХГҮЙ, оронд нь `proxy_pass`-д хувьсагч
# ($bf_frontend г.м.) ашиглана — хувьсагчтай үед nginx нь DNS-ыг
# ГҮЙЛГЭЭ БҮРД resolver-ээр дахин шийддэг тул IP солигдоход өөрөө дагана.
#
# ⚠️⚠️ ЭНД ЗАРЛАХГҮЙ — `besttv.conf`-д аль хэдийн бий.
#
# БОДИТ АЛДАА: nginx нь давхардсан `resolver`-ыг ЗӨВШӨӨРДӨГГҮЙ:
#   nginx: [emerg] "resolver" directive is duplicate
#
# ⚠️ Миний анхны таамаг («сүүлийнх ялна») БУРУУ байсан — `resolver`
#    нь `map`-тай адил давхардаж БОЛОХГҮЙ.
#
# ⚠️ ДАРААЛАЛ САНААГ ЗОВООХГҮЙ: nginx нь БҮХ conf-ыг уншиж дуусаад
#    л ажиллуулдаг. `besttv.conf`-ийн `resolver` нь ЭНЭ файлын
#    `proxy_pass`-д ч үйлчилнэ (http блокийн хамрах хүрээ).
#
# ⚠️ Хэрэв `besttv.conf` устгагдвал ЭНД сэргээх ЁСТОЙ —
#    эс бөгөөс container restart хийхэд 502 өгнө.

# ── СПАМ / БОТ ХАМГААЛАЛТ ───────────────────────────────────────────────────
# ⚠️ Түлхүүр = Cloudflare-ийн ЖИНХЭНЭ клиент IP. `$binary_remote_addr` шууд
# ашиглавал бүх хэрэглэгч Cloudflare-ийн edge IP-тэй мэт тоологдож,
# нэг бот БҮХ хүнийг блоклоно.
map $http_cf_connecting_ip $bestfilm_client_ip {
    ""      $binary_remote_addr;  # Cloudflare-гүй (шууд хандалт)
    default $http_cf_connecting_ip;
}

limit_req_zone $bestfilm_client_ip zone=bestfilm_api:10m rate=20r/s;
limit_req_zone $bestfilm_client_ip zone=bestfilm_auth:10m rate=1r/s;
limit_req_zone $bestfilm_client_ip zone=bestfilm_write:10m rate=5r/s;
limit_conn_zone $bestfilm_client_ip zone=bestfilm_conn:10m;

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name bestfilm.net www.bestfilm.net api.bestfilm.net;
    return 301 https://$host$request_uri;
}

# ── bestfilm.net — Frontend ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name bestfilm.net www.bestfilm.net;

    # ⚠️ Хувьсагч — DNS-ыг гүйлгээ бүрд дахин шийдүүлнэ (rebuild-д 502 өгөхгүй).
    # IP hardcode ХИЙХГҮЙ — container restart хийхэд солигдоно.
    set $bf_frontend bestfilm-frontend:3102;
    # ⚠️⚠️ Backend нь BestTV-ийнх — НЭГ backend хоёр сайтад үйлчилнэ
    set $bf_backend  besttv-backend:4100;

    # ⚠️ Cloudflare Origin сертификат — ТА үүсгэнэ (доорх заавар)
    ssl_certificate /etc/ssl/cloudflare/bestfilm.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bestfilm.key;
    include /etc/nginx/conf.d/ssl.conf;

    client_max_body_size 20m;

    # ⚠️ Аюулгүй байдлын толгойнууд — Google Safe Browsing болон бусад
    # сканнерын үнэлгээнд ЧУХАЛ. ШИНЭ ДОМЭЙН дээр эдгээр байхгүй бол
    # «сэжигтэй» гэж тэмдэглэгдэх магадлал ӨНДӨР.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location / {
        proxy_pass http://$bf_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js static — hash нэртэй тул мөнхийн cache
    location /_next/static/ {
        proxy_pass http://$bf_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://$bf_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ⚠️⚠️ HLS stream — BestTV-ийн backend руу.
    #    Кино нь ХУВААЛЦСАН тул segment-үүд нь ижил R2 сангаас ирнэ.
    location /api/stream/ {
        proxy_pass http://$bf_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ⚠️⚠️ САЙТЫГ ТАНИУЛНА — backend нь эрхийг САЙТААР шалгана.
        #    Үүнгүйгээр BestFilm-ийн захиалагч «эрхгүй» гэж 403 авна.
        proxy_set_header X-Site "bestfilm";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ⚠️ Нэвтрэлт — brute-force хамгаалалт (секундэд 1, burst 5)
    location ~ ^/api/auth/(login|register|oauth) {
        limit_req zone=bestfilm_auth burst=5 nodelay;
        limit_conn bestfilm_conn 10;

        proxy_pass http://$bf_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Site "bestfilm";
    }

    # ⚠️ Нээлттэй бичилтийн endpoint — спам хамгаалалт
    location ~ ^/api/(email/subscribe|email/unsubscribe|track|reviews) {
        limit_req zone=bestfilm_write burst=10 nodelay;
        limit_conn bestfilm_conn 15;

        proxy_pass http://$bf_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Site "bestfilm";
    }

    # ⚠️⚠️ Бусад /api/* → FRONTEND (backend БИШ!)
    #
    # БОДИТ АЛДАА: backend руу шууд илгээхэд `/api/auth/providers`,
    # `/api/auth/session` зэрэг NextAuth-ийн зам backend руу очиж
    # 404/500 буцаана → GOOGLE/FACEBOOK НЭВТРЭЛТ ОГТ АЖИЛЛАХГҮЙ.
    #
    # ⚠️ `/api/auth/[...nextauth]` нь FRONTEND-д амьдардаг. Next.js
    #    нь `next.config.ts`-ийн rewrite-аар БУСДЫГ backend руу
    #    дамжуулна (NextAuth-ийн мэддэг action-уудыг үлдээгээд).
    #
    # ⚠️ BestTV ч ЯГ ИЖИЛ (`besttv.conf:122`) — хоёр сайт нэг зан төлөв.
    location /api/ {
        limit_req zone=bestfilm_api burst=40 nodelay;
        limit_conn bestfilm_conn 30;

        proxy_pass http://$bf_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ⚠️ Frontend нь өөрөө `X-Site` нэмдэг (`lib/api.ts`,
        #    `server-api.ts`) ч энд ч тавьж давхар хамгаална.
        proxy_set_header X-Site "bestfilm";
        proxy_read_timeout 120s;
    }
}

# ── api.bestfilm.net — API шууд хандалт ──────────────────────────────────────
#
# ⚠️ Имэйлийн зураг (нээлтийн pixel), unsubscribe холбоос зэрэг нь
#    энэ домэйнээр ирнэ. Мөн mobile апп ирээдүйд.
server {
    listen 443 ssl;
    http2 on;
    server_name api.bestfilm.net;

    set $bf_backend besttv-backend:4100;

    ssl_certificate /etc/ssl/cloudflare/bestfilm.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bestfilm.key;
    include /etc/nginx/conf.d/ssl.conf;

    client_max_body_size 5g;
    # ⚠️ API домэйныг индексжүүлэхгүй
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        limit_req zone=bestfilm_api burst=40 nodelay;
        limit_conn bestfilm_conn 30;

        proxy_pass http://$bf_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Site "bestfilm";
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
